spring:
  config:
    import: optional:file:${LIBRARY_CONFIG:./config.yaml}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/linjun_library?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:linjun_library}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    time-zone: Asia/Shanghai
server:
  port: ${PORT:8080}
  error:
    include-message: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
library:
  borrow-days: 30
  max-loans: 5
  fine-per-day: 0.50
  locker-max-days: 30
  checkin-grace-minutes: 30
  demo-seed: true
  demo-password: ${DEMO_PASSWORD:Library123!}
